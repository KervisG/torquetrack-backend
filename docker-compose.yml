services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: torquetrack
      POSTGRES_PASSWORD: torquetrack
      POSTGRES_DB: torquetrack
    ports:
      - "5435:5432"
    volumes:
      - torquetrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torquetrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # El target por defecto del Dockerfile es producción (gunicorn); en local
    # se usa `dev`, con runserver y las dependencias de los tests.
    build:
      context: .
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8010:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://torquetrack:torquetrack@db:5432/torquetrack
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  torquetrack_pgdata:
    # Arranca vacío: `python manage.py migrate` crea todas las tablas.
