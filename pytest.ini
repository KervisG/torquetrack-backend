[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
# `--ds` gana sobre la variable de entorno: la imagen de producción define
# `DJANGO_SETTINGS_MODULE=config.settings.prod` y los tests no deben heredarlo.
addopts = -ra --ds=config.settings.dev
# Los tests no corren `collectstatic`: WhiteNoise avisa que falta `STATIC_ROOT`.
filterwarnings =
    ignore:No directory at:UserWarning
